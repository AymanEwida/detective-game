[package]
name = "detective-game"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
glfw = "0.58.0"
gl = "0.14.0"
image = "0.24.0"
freetype-rs = { version = "0.37.0", features = ["bundled"] }
freetype-sys = { version = "0.21.0", features = ["bundled"] }
glam = { version = "0.29.0", features = ["glam-assert"] }
rand = "0.8.5"
queues = "1.0.2"
derivative = "2.2.0"
